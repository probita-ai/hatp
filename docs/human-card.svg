<svg xmlns="http://www.w3.org/2000/svg" width="800" height="372" viewBox="0 0 800 372" role="img" aria-label="Human Card for Bob Chen, finance approver at acme.com">
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .rule { stroke: #d0d7de; }
    .name { font: 600 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .id { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .label { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: 0.06em; }
    .value { font: 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .chip { fill: #f6f8fa; stroke: #d0d7de; }
    .chiptext { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .avatar { fill: #ddf4ff; }
    .initials { font: 600 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0969da; }
    .badge { fill: #0969da; }
    .badgetext { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 0.08em; }
    .ok { fill: #1a7f37; }
    .oktext { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a7f37; }
    .note { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .rule { stroke: #3d444d; }
      .name, .value, .mono, .chiptext { fill: #f0f6fc; }
      .id, .label, .note { fill: #9198a1; }
      .chip { fill: #151b23; stroke: #3d444d; }
      .avatar { fill: #0c2d6b; }
      .initials { fill: #4493f8; }
      .badge { fill: #1f6feb; }
      .ok { fill: #3fb950; }
      .oktext { fill: #3fb950; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="799" height="371" rx="12"/>

  <!-- header -->
  <circle class="avatar" cx="64" cy="62" r="32"/>
  <text class="initials" x="64" y="69" text-anchor="middle">BC</text>
  <text class="name" x="112" y="56">Bob Chen</text>
  <text class="id" x="112" y="82">human://acme.com/bob</text>

  <rect class="badge" x="660" y="28" width="108" height="24" rx="12"/>
  <text class="badgetext" x="714" y="44" text-anchor="middle">HUMAN CARD</text>
  <text class="oktext" x="768" y="81" text-anchor="end">✓ signed by directory.acme.com</text>

  <line class="rule" x1="32" y1="114" x2="768" y2="114"/>

  <!-- left column -->
  <text class="label" x="32" y="148">ROLES</text>
  <rect class="chip" x="140" y="133" width="116" height="22" rx="11"/>
  <text class="chiptext" x="198" y="148" text-anchor="middle">finance-approver</text>

  <text class="label" x="32" y="186">SKILLS</text>
  <text class="value" x="140" y="186">travel-policy, sox-controls</text>

  <text class="label" x="32" y="224">AUTHORITY</text>
  <text class="mono" x="140" y="224">approve.spend ≤ $10,000</text>

  <text class="label" x="32" y="262">DELEGATES</text>
  <text class="mono" x="140" y="262">human://acme.com/carol</text>

  <!-- right column -->
  <text class="label" x="420" y="148">CHANNELS</text>
  <rect class="chip" x="530" y="133" width="50" height="22" rx="11"/>
  <text class="chiptext" x="555" y="148" text-anchor="middle">slack</text>
  <rect class="chip" x="588" y="133" width="42" height="22" rx="11"/>
  <text class="chiptext" x="609" y="148" text-anchor="middle">sms</text>
  <rect class="chip" x="638" y="133" width="50" height="22" rx="11"/>
  <text class="chiptext" x="663" y="148" text-anchor="middle">voice</text>

  <text class="label" x="420" y="186">AVAILABILITY</text>
  <circle class="ok" cx="535" cy="181" r="4"/>
  <text class="value" x="546" y="186">available · Mo–Fr 09–18 ET</text>

  <text class="label" x="420" y="224">SLA</text>
  <text class="value" x="530" y="224">ack 5 min · decide 15 min</text>

  <text class="label" x="420" y="262">CAPACITY</text>
  <text class="value" x="530" y="262">2 of 10 open asks</text>

  <line class="rule" x1="32" y1="296" x2="768" y2="296"/>
  <text class="note" x="32" y="324">Agents see channel types, never addresses: phone numbers and Slack IDs stay inside the Human Gateway.</text>
  <text class="note" x="32" y="346">Authority is enforced by the gateway; it is published only so agents can pick sensible approvers.</text>
</svg>
