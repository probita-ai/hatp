name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # hatp-mcp and the MCP demo import hatp-protocol through its build output.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node demo/trip.ts --auto --scenario=happy
      - run: node demo/mcp-trip.ts
      - run: npm pack --dry-run --workspaces
