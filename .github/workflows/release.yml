name: Release

# Publishes to npm whenever main carries a package version that isn't on npm yet.
# To release: merge a PR that bumps sdk/ and/or mcp/ package.json versions.
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC): no npm token is stored in GitHub

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # hatp-protocol first: hatp-mcp depends on it.
      - name: Publish versions not yet on npm
        run: |
          for dir in sdk mcp; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac # pre-releases never become the default install
            echo "Publishing $name@$version with tag $tag"
            (cd "$dir" && npm publish --access public --tag "$tag")
          done
