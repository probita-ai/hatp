name: Release

# Publishes to npm whenever main carries a package version that isn't on npm yet.
# To release: merge a PR that bumps sdk/ and/or mcp/ package.json versions.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run by hand, e.g. after setting up trusted publishing on npmjs.com

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC): no npm token is stored in GitHub

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check that GitHub issued an OIDC token for npm
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token: the job lacks 'id-token: write', so npm trusted publishing cannot work."
            exit 1
          fi
          echo "OIDC token available. If publishing still fails with 404, check the package's Trusted Publisher on npmjs.com (repo probita-ai/hatp, workflow release.yml)."
      # hatp-protocol first: hatp-mcp depends on it.
      - name: Publish versions not yet on npm
        run: |
          for dir in sdk mcp; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac # pre-releases never become the default install
            echo "Publishing $name@$version with tag $tag"
            (cd "$dir" && npm publish --access public --tag "$tag")
          done
      # npm only explains a refused publisher in its debug log (the console just says 404).
      - name: Show why npm refused the publish
        if: failure()
        run: |
          grep -hiE "oidc|trusted|provenance|token|auth|E404|403" ~/.npm/_logs/*-debug-*.log | grep -viE "npm-gat|bypass2fa" | tail -40 || true
