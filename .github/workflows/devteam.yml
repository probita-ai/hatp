# Dev team: planner → coder → tester → (fix → retest) → PR → reviewer.
# Starts when an issue gets the `agent` label (or manually with an issue number).
# Each agent is its own job, so the run graph in the Actions tab shows the pipeline.
name: devteam

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

concurrency:
  group: devteam-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  BRANCH: devteam/issue-${{ github.event.issue.number || inputs.issue }}
  BASE: ${{ github.event.repository.default_branch }}
  DT: ${{ github.workspace }}/devteam/.github/devteam
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    working-directory: repo

jobs:
  planner:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.plan.outputs.verdict }}
    steps:
      # The pipeline scripts always come from the default branch, never from the
      # branch the agents write to.
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BASE }}' }
      - name: Fetch issue
        run: |
          mkdir -p .pipeline
          gh issue view "$ISSUE" --json number,title,body,author,labels \
            --template '# #{{.number}}: {{.title}}{{"\n\n"}}{{.body}}{{"\n"}}' > .pipeline/issue.md
          ISSUE_TITLE="$(gh issue view "$ISSUE" --json title -q .title)" node "$DT/status.mjs" init
          node "$DT/status.mjs" set "branch=$BRANCH"
          git checkout -b "$BRANCH"
      - id: plan
        run: node "$DT/run-agent.mjs" planner --output .pipeline/spec.md
      - name: Ask for info
        if: steps.plan.outputs.verdict == 'NEEDS_INFO'
        run: |
          { echo "### 🤖 The planner needs more information before starting"; echo
            sed -n '/^## Questions/,$p' .pipeline/spec.md; echo
            echo "Answer in the issue, then remove and re-add the \`agent\` label."; } > "$RUNNER_TEMP/q.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/q.md"
      - if: steps.plan.outputs.verdict == 'READY'
        run: 'bash "$DT/push.sh" "devteam(planner): spec for #$ISSUE" --force'

  coder:
    needs: planner
    if: needs.planner.outputs.status == 'READY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BRANCH }}' }
      - run: node "$DT/run-agent.mjs" coder
      - run: 'bash "$DT/push.sh" "devteam(coder): implement #$ISSUE"'

  tester:
    needs: coder
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.test.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BRANCH }}' }
      - id: test
        run: node "$DT/run-agent.mjs" tester
      - run: 'bash "$DT/push.sh" "devteam(tester): tests for #$ISSUE"'

  coder-fix:
    needs: tester
    if: needs.tester.outputs.result == 'FAIL'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BRANCH }}' }
      - run: node "$DT/run-agent.mjs" coder --round 2
      - run: 'bash "$DT/push.sh" "devteam(coder): fix failing tests for #$ISSUE"'

  tester-retry:
    needs: coder-fix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.test.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BRANCH }}' }
      - id: test
        run: node "$DT/run-agent.mjs" tester --round 2
      - run: 'bash "$DT/push.sh" "devteam(tester): re-test #$ISSUE"'

  pull-request:
    needs: [tester, tester-retry]
    if: always() && needs.tester.result == 'success' && needs.tester-retry.result != 'failure' && needs.tester-retry.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BRANCH }}' }
      - id: pr
        env:
          RESULT: ${{ needs.tester-retry.outputs.result || needs.tester.outputs.result }}
        run: |
          {
            echo "Closes #$ISSUE"; echo
            echo "Built by the devteam pipeline. Tests: **$RESULT**. The reviewer's verdict will follow as a review comment and as the \`devteam/review\` status check."; echo
            cat .pipeline/changes.md; echo
            echo "<details><summary>Test report</summary>"; echo; cat .pipeline/test-report.md; echo; echo "</details>"
          } > "$RUNNER_TEMP/body.md"
          title="[devteam] #$ISSUE: $(gh issue view "$ISSUE" --json title -q .title)"
          pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            draft=""; [ "$RESULT" = "PASS" ] || draft="--draft"
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md" $draft
            pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          node "$DT/status.mjs" set "pr=$pr"

  reviewer:
    needs: pull-request
    if: always() && needs.pull-request.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - uses: ./devteam/.github/devteam/setup
        with: { ref: '${{ env.BRANCH }}' }
      - run: git diff "origin/$BASE...HEAD" -- . ':(exclude).pipeline' > .pipeline/diff.patch
      - id: review
        run: node "$DT/run-agent.mjs" reviewer --output .pipeline/review.md
      - uses: actions/upload-artifact@v4
        with: { name: 'pipeline-issue-${{ env.ISSUE }}', path: repo/.pipeline, include-hidden-files: true }
      - name: Remove handoff files from the branch
        run: |
          cp -r .pipeline "$RUNNER_TEMP/pipeline"
          git rm -rq --ignore-unmatch .pipeline && rm -rf .pipeline
          bash "$DT/push.sh" "devteam: remove .pipeline handoff files"
      - name: Post verdict
        env:
          PR: ${{ needs.pull-request.outputs.pr }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/pipeline/review.md" || \
            gh pr comment "$PR" --body "Reviewer verdict: $VERDICT (see the pipeline artifact)."
          state=failure; [ "$VERDICT" = "APPROVE" ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=devteam/review -f description="Reviewer: $VERDICT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  report:
    needs: [planner, coder, tester, coder-fix, tester-retry, pull-request, reviewer]
    if: always() && needs.planner.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: devteam, sparse-checkout: .github/devteam, persist-credentials: false }
      - working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.planner.outputs.status }}
          VERDICT: ${{ needs.reviewer.outputs.verdict }}
        run: |
          if [ "$PLAN" = "NEEDS_INFO" ]; then state=needs_info
          elif echo "$RESULTS" | grep -qE '"result": "(failure|cancelled)"'; then state=failed
          elif [ "$VERDICT" = "REQUEST_CHANGES" ]; then state=changes_requested
          else state=done; fi
          node "$DT/status.mjs" finish "$state"
